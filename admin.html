<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Soot Destroyer Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div id="login" class="login-shell">
        <div class="login-card">
            <img src="sootlogo.jpg" alt="Soot Destroyer">
            <span class="eyebrow">Admin</span>
            <h1>Booking <em>control.</em></h1>
            <p>Sign in to manage availability, services and customer bookings.</p>
            <form id="loginForm">
                <label>Email<input id="loginEmail" type="email" autocomplete="username" required value="liam7388@gmail.com"></label>
                <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
                <button>Sign in →</button>
                <div id="loginMessage"></div>
            </form>
        </div>
    </div>
    <script src="admin-login.js"></script>
</body>

</html>
